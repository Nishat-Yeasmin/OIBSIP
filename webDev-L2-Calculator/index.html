<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- Display -->
        <div class="display">

            <div id="currentInput" class="current-input">
                0
            </div>

            <div id="result" class="result">
                0
            </div>

        </div>


        <!-- Calculator Buttons -->
        <div class="buttons">

            <!-- First Row -->
            <button class="btn clear" data-action="clear">
                C
            </button>

            <button class="btn delete" data-action="delete">
                ⌫
            </button>

            <button class="btn operator" data-operator="/">
                ÷
            </button>

            <button class="btn operator" data-operator="*">
                ×
            </button>


            <!-- Second Row -->
            <button class="btn number" data-number="7">
                7
            </button>

            <button class="btn number" data-number="8">
                8
            </button>

            <button class="btn number" data-number="9">
                9
            </button>

            <button class="btn operator" data-operator="-">
                −
            </button>


            <!-- Third Row -->
            <button class="btn number" data-number="4">
                4
            </button>

            <button class="btn number" data-number="5">
                5
            </button>

            <button class="btn number" data-number="6">
                6
            </button>

            <button class="btn operator" data-operator="+">
                +
            </button>


            <!-- Fourth Row -->
            <button class="btn number" data-number="1">
                1
            </button>

            <button class="btn number" data-number="2">
                2
            </button>

            <button class="btn number" data-number="3">
                3
            </button>

            <button class="btn equals" data-action="equals">
                =
            </button>


            <!-- Fifth Row -->
            <button class="btn number zero" data-number="0">
                0
            </button>

            <button class="btn number" data-number=".">
                .
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
